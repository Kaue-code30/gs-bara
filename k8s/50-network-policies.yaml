apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: store-data
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-authorized-workloads
  namespace: store-data
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  podSelector:
    matchLabels:
      app: store-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-prod
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - store-api
                  - store-worker
                  - db-migrate
                  - store-report
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-authorized-workloads
  namespace: store-data
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  podSelector:
    matchLabels:
      app: store-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-prod
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - store-api
                  - store-worker
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 6379
