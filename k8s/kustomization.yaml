apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespaces.yaml
  - 01-storage.yaml
  - 10-data.yaml
  - 20-config-rbac.yaml
  - 30-applications.yaml
  - 40-autoscaling-jobs.yaml
  - 50-network-policies.yaml
  - 60-ingress.yaml
  - 70-platform-observer.yaml

images:
  - name: store-api-image
    newName: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/store-api
    newTag: "1.0"
  - name: store-worker-image
    newName: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/store-worker
    newTag: "1.0"
  - name: store-front-image
    newName: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/store-front
    newTag: "1.0"
